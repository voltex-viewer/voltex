name: Packages CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/plugin-api/**'
      - 'packages/mdf-reader/**'
      - 'packages/signal-utils/**'
      - '.github/workflows/packages.yml'
      - 'package-lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/plugin-api/**'
      - 'packages/mdf-reader/**'
      - 'packages/signal-utils/**'
      - '.github/workflows/packages.yml'
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build plugin-api
      working-directory: packages/plugin-api
      run: npm run build

    - name: Build mdf-reader
      working-directory: packages/mdf-reader
      run: npm run build

    - name: Build signal-utils
      working-directory: packages/signal-utils
      run: npm run build

    - name: Validate plugin-api package
      working-directory: packages/plugin-api
      run: npm pack --dry-run

    - name: Validate mdf-reader package
      working-directory: packages/mdf-reader
      run: npm pack --dry-run

    - name: Validate signal-utils package
      working-directory: packages/signal-utils
      run: npm pack --dry-run

    - name: Upload plugin-api artifacts
      uses: actions/upload-artifact@v7
      with:
        name: plugin-api-dist
        path: packages/plugin-api/dist/
        retention-days: 7

    - name: Upload mdf-reader artifacts
      uses: actions/upload-artifact@v7
      with:
        name: mdf-reader-dist
        path: packages/mdf-reader/dist/
        retention-days: 7

    - name: Upload signal-utils artifacts
      uses: actions/upload-artifact@v7
      with:
        name: signal-utils-dist
        path: packages/signal-utils/dist/
        retention-days: 7

    - name: Dry-run publish plugin-api
      if: github.event_name == 'pull_request'
      working-directory: packages/plugin-api
      run: npm publish --dry-run

    - name: Dry-run publish mdf-reader
      if: github.event_name == 'pull_request'
      working-directory: packages/mdf-reader
      run: npm publish --dry-run

    - name: Dry-run publish signal-utils
      if: github.event_name == 'pull_request'
      working-directory: packages/signal-utils
      run: npm publish --dry-run

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Check versions match tag
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        for p in plugin-api mdf-reader signal-utils; do
          ACTUAL=$(node -p "require('./packages/$p/package.json').version")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::$p is $ACTUAL but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
        done

    - name: Build plugin-api
      working-directory: packages/plugin-api
      run: npm run build

    - name: Build mdf-reader
      working-directory: packages/mdf-reader
      run: npm run build

    - name: Build signal-utils
      working-directory: packages/signal-utils
      run: npm run build

    - name: Publish plugin-api to NPM
      working-directory: packages/plugin-api
      run: npm publish --access public --provenance

    - name: Publish mdf-reader to NPM
      working-directory: packages/mdf-reader
      run: npm publish --access public --provenance

    - name: Publish signal-utils to NPM
      working-directory: packages/signal-utils
      run: npm publish --access public --provenance
